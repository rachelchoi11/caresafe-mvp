<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#005F73">
<title>보호자 · CareSafe</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 대응가이드 모달 */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(15,23,42,0.6);
    z-index:9000; display:flex; align-items:flex-end; justify-content:center;
    padding:0; animation:fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-content {
    background:white; width:100%; max-width:560px;
    border-radius:20px 20px 0 0; padding:20px 20px 32px;
    max-height:88vh; overflow-y:auto; position:relative;
    animation:slideUp 0.2s ease;
  }
  .modal-close {
    position:absolute; top:14px; right:14px;
    background:#F1F5F9; border:none; width:36px; height:36px;
    border-radius:50%; font-size:16px; cursor:pointer; color:#475569;
  }
  .modal-content h2 { margin:0 0 4px; font-size:20px; color:#0F172A; padding-right:32px; }
  .modal-content .severity-pill {
    display:inline-block; padding:3px 10px; border-radius:999px;
    font-size:11px; font-weight:700; letter-spacing:0.5px; margin-bottom:8px;
  }
  .modal-content .severity-pill.danger { background:#FEE2E2; color:#991B1B; }
  .modal-content .severity-pill.warn { background:#FEF3C7; color:#92400E; }
  .modal-content .severity-pill.ok { background:#DCFCE7; color:#166534; }
  .modal-content .intro { color:#475569; line-height:1.55; margin:8px 0 18px; font-size:14px; }
  .modal-steps { margin:0; padding:0; list-style:none; counter-reset:step; }
  .modal-steps li {
    display:flex; gap:12px; padding:14px 0; border-bottom:1px solid #F1F5F9;
    counter-increment:step;
  }
  .modal-steps li:last-child { border-bottom:none; }
  .modal-steps li::before {
    content: counter(step);
    flex-shrink:0; width:28px; height:28px; border-radius:50%;
    background:#005F73; color:white; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:13px;
  }
  .modal-steps .do { font-weight:600; color:#0F172A; font-size:15px; line-height:1.4; }
  .modal-steps .note { color:#64748B; font-size:13px; margin-top:4px; line-height:1.5; }
  .modal-pitfalls {
    margin-top:18px; padding:14px; background:#FEF3C7; border-radius:10px;
    border:1px solid #FCD34D;
  }
  .modal-pitfalls h3 { margin:0 0 6px; font-size:13px; color:#92400E; }
  .modal-pitfalls ul { margin:0; padding-left:18px; color:#92400E; font-size:13px; line-height:1.6; }

  .alert-clickable { cursor:pointer; transition:background 0.15s; }
  .alert-clickable:hover { background:#F8FAFC; }
  .alert-chevron { color:#94A3B8; margin-left:auto; font-size:13px; }

  /* 체크리스트 */
  .checklist-section { margin-bottom:14px; }
  .checklist-section:last-child { margin-bottom:0; }
  .checklist-section .sec-title {
    font-size:12px; color:#64748B; text-transform:uppercase;
    letter-spacing:0.6px; font-weight:700; margin-bottom:6px;
  }
  .checklist-item {
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 12px; border-radius:10px; cursor:pointer;
    background:#F8FAFC; margin-bottom:6px; transition:background 0.1s;
  }
  .checklist-item:hover { background:#F1F5F9; }
  .checklist-item.done { background:#DCFCE7; }
  .checklist-item.done .text { color:#166534; text-decoration:line-through; }
  .checklist-item .checkbox {
    width:22px; height:22px; border-radius:6px; border:2px solid #94A3B8;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; background:white; color:white; font-size:14px;
  }
  .checklist-item.done .checkbox { background:#22C55E; border-color:#22C55E; }
  .checklist-item .text { flex:1; font-size:14px; color:#0F172A; line-height:1.4; }
  .checklist-item .tip { color:#94A3B8; font-size:12px; margin-top:2px; }
  .checklist-progress {
    background:#F1F5F9; height:8px; border-radius:999px; overflow:hidden;
    margin-bottom:14px;
  }
  .checklist-progress > div {
    background:linear-gradient(90deg, #0A9396, #94D2BD);
    height:100%; transition:width 0.3s;
  }
</style>
</head>

      <div class="stat"><div class="n" id="sPing">3분 전</div><div class="l">마지막 신호</div></div>

      </div>

    </div>

    <div class="card">
      <div class="title-row">
        <h2>돌봄 대상자 선택</h2>
        <span class="muted">복수 부모님 지원</span>
      </div>
      <ul class="list" id="seniorSwitch"></ul>
    </div>

    <div class="card">
      <h2>긴급 연락</h2>
      <div class="stack">
        <a class="btn block" href="tel:119" style="text-decoration:none; display:flex; align-items:center; justify-content:center">🚨 119 전화 걸기</a>
        <button class="btn ghost block" id="callDoctor">☎️ 주치의 연결</button>

    <div class="card" id="emergencyCard">

      <div id="emergencyPreview" class="stack" style="font-size:14px"></div>
      <div class="stack" style="margin-top:12px">
        <button class="btn block" id="showQrBtn">🔳 QR 카드 보기</button>
        <a class="btn ghost block" id="openCardLink" target="_blank" rel="noopener" style="text-decoration:none; display:flex; align-items:center; justify-content:center">↗ 응급카드 페이지 열기</a>
      </div>
      <div id="qrBox" style="display:none; text-align:center; padding:16px; background:#F8FAFC; border-radius:10px; margin-top:12px">
        <div id="qrcode" style="display:inline-block; padding:12px; background:white; border-radius:8px"></div>
        <div class="muted" style="margin-top:10px; font-size:12px; word-break:break-all" id="qrUrl"></div>
        <button class="btn ghost" onclick="window.print()" style="margin-top:10px">🖨 인쇄</button>
      </div>
    </div>

    <div class="card">
      <div class="title-row">
        <h2>이번 주 안전 체크</h2>
        <span class="muted" id="checklistCount">0 / 0</span>
      </div>
      <div class="checklist-progress"><div id="checklistBar" style="width:0%"></div></div>
      <div id="checklistBody"></div>
    </div>
  </section>

  <!-- 대응가이드 모달 -->
  <div id="guideModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeGuide()">
    <div class="modal-content">
      <button class="modal-close" onclick="closeGuide()">✕</button>
      <span id="guideSeverity" class="severity-pill"></span>
      <h2 id="guideTitle"></h2>
      <p id="guideIntro" class="intro"></p>
      <ol id="guideSteps" class="modal-steps"></ol>
      <div id="guidePitfalls" class="modal-pitfalls" style="display:none">
        <h3>⚠️ 주의할 점</h3>
        <ul id="guidePitfallList"></ul>
      </div>
    </div>
  </div>

  <nav class="tabs">
    <a href="guardian.html" class="active"><span class="ic">🏠</span>홈</a>
    <a href="#" onclick="alert('데모: 활동 그래프 화면')"><span class="ic">📊</span>활동</a>
    <a href="#" onclick="alert('데모: AI 돌봄 코디네이터 상담')"><span class="ic">💬</span>상담</a>
    <a href="#" onclick="alert('데모: 설정')"><span class="ic">⚙️</span>설정</a>
  </nav>

<script src="app.js"></script>
<script type="module" src="auth-guard.js"></script>
<script type="module" src="app-firebase.js"></script>
<script src="data/guide.js"></script>
<script src="data/ai_guide_variants.js"></script>
<script src="data/checklist.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const ICONS = { sos: '🆘', fall: '⚠️', battery: '🔋', medication: '💊', activity: '🟢', inactivity: '⏸️' };
const LEVEL_TEXT = { ok: '정상', warn: '주의', danger: '위급' };

function render() {
  const state = CareSafe.load();
  const active = state.seniors.find(s => s.id === state.activeUid) || state.seniors[0];

  // hero
  const hero = document.getElementById('hero');
  hero.className = 'status-hero ' + (active.status === 'ok' ? '' : active.status);
  document.getElementById('heroWho').textContent = active.name + ' ' + (active.name.endsWith('자') || active.name.endsWith('숙') || active.name.endsWith('애') ? '어머니' : '아버지') + ' · ' + active.age + '세';
  document.getElementById('heroState').textContent = LEVEL_TEXT[active.status] || '정상';
  const lastAlert = state.alerts.find(a => a.uid === active.id);
  document.getElementById('heroDesc').textContent = active.status === 'danger' ? '긴급 신호 수신 — 즉시 확인 필요' : active.status === 'warn' ? (lastAlert?.text || '주의 필요') : '마지막 활동 감지: ' + CareSafe.fmtTime(active.lastPing);
  document.getElementById('heroTime').textContent = active.note;

  // stats
  document.getElementById('sBattery').textContent = active.battery + '%';
  document.getElementById('sPing').textContent = CareSafe.fmtTime(active.lastPing);

  // alerts (클릭 시 대응가이드 모달 — AI 변형 매칭)
  const mine = state.alerts.filter(a => a.uid === active.id).slice(0, 6);
  const ul = document.getElementById('alertList');
  ul.innerHTML = mine.map(a => `
    <li class="list-item alert-clickable ${a.level}" onclick="openGuideForAlert('${a.id}')">
      <div class="icon">${ICONS[a.type] || '🔔'}</div>
      <div class="body">
        <div class="t">${a.text}</div>
        <div class="s">${CareSafe.fmtTime(a.time)} · <span class="pill ${a.level}">${LEVEL_TEXT[a.level]}</span></div>
      </div>
      <span class="alert-chevron">대응가이드 ›</span>
    </li>`).join('') || '<li class="muted" style="padding:16px; text-align:center">아직 알림이 없습니다</li>';
  document.getElementById('alertCount').textContent = mine.length + '건';

  // switcher
  const sw = document.getElementById('seniorSwitch');
  sw.innerHTML = state.seniors.map(s => `
    <li class="list-item ${s.id === active.id ? 'ok' : ''}" style="cursor:pointer" onclick="CareSafe.setActive('${s.id}'); render();">
      <div class="icon">${s.id === active.id ? '✅' : '👵'}</div>
      <div class="body">
        <div class="t">${s.name} (${s.age}세)</div>
        <div class="s">${s.region} · ${s.guardian}</div>
      </div>
      <span class="pill ${s.status}">${LEVEL_TEXT[s.status]}</span>
    </li>`).join('');

  // 응급정보 카드 미리보기 + QR 링크
  renderEmergencyCard(active);
  // 이번 주 안전 체크
  renderChecklist(active.id);
}

// ===== 대응가이드 모달 (AI 변형 매칭 + 정적 fallback) =====
//
// 매칭 로직:
//   1. alert.type + alert.level → 변형 키 (sos→sos_urgent/sos_help, 그 외 그대로)
//   2. 시니어 프로필(critical_meds, cognitive, recent surgery)로 점수 계산
//   3. 최고 점수 AI 변형 사용 (data/ai_guide_variants.js)
//   4. AI 변형 없으면 정적 가이드(data/guide.js) 사용
//   5. 정적도 없으면 에러 표시

function _scoreProfileMatch(match, senior) {
  if (!match) return 0;
  let score = 0;
  // 항응고제·항혈소판제·인슐린·스테로이드 매칭
  if (match.critical_meds) {
    const seniorCrit = (senior.meds || []).map(m => m.critical).filter(Boolean);
    if (match.critical_meds.some(c => seniorCrit.includes(c))) score += 10;
  }
  // 인지 기준선 매칭
  if (match.cognitive) {
    if (senior.cognitiveBaseline && match.cognitive.includes(senior.cognitiveBaseline)) score += 10;
  }
  // 최근 수술 (recent_surgery_weeks 이내)
  if (match.recent_surgery_weeks) {
    const surgeries = (senior.recentHistory || []).filter(h =>
      h.type === '수술' || h.type === '시술'
    );
    for (const s of surgeries) {
      const daysSince = (Date.now() - new Date(s.date).getTime()) / 86400000;
      if (daysSince <= match.recent_surgery_weeks * 7) { score += 10; break; }
    }
  }
  return score;
}

function _resolveVariantKey(alert) {
  // alert.type='sos' + level=danger → sos_urgent
  // alert.type='sos' + level=warn → sos_help
  // 그 외 type 그대로
  if (alert.type === 'sos') {
    return alert.level === 'danger' ? 'sos_urgent' : 'sos_help';
  }
  if (alert.type === 'inactivity' && /무소식/.test(alert.text || '')) {
    return 'no_signal';
  }
  return alert.type;
}

function _selectGuide(alert, senior) {
  const variantKey = _resolveVariantKey(alert);
  const variants = (window.CareSafeGuideVariants || {})[variantKey] || [];

  if (variants.length && senior) {
    const scored = variants.map(v => ({ v, score: _scoreProfileMatch(v.match, senior) }));
    scored.sort((a, b) => b.score - a.score);
    const best = scored[0];
    if (best.score > 0) {
      return { ...best.v, _source: `AI 변형 (${best.v.profile})` };
    }
    // 점수 0이면 default 프로필 우선
    const def = variants.find(v => v.profile === 'default') || scored[0].v;
    return { ...def, _source: 'AI 변형 (기본)' };
  }

  // Fallback: 정적 가이드 (data/guide.js)
  const staticGuide = (window.CareSafeGuide || {})[alert.type];
  if (staticGuide) {
    return { ...staticGuide, _source: '정적 가이드' };
  }
  return null;
}

function openGuideForAlert(alertId) {
  const state = CareSafe.load();
  const alert = state.alerts.find(a => a.id === alertId);
  if (!alert) {
    console.warn('Alert not found:', alertId);
    return;
  }
  const senior = state.seniors.find(s => s.id === alert.uid);
  const guide = _selectGuide(alert, senior);
  if (!guide) {
    window.alert('대응가이드가 등록되지 않은 알림 유형입니다.');
    return;
  }
  _renderGuideModal(guide);
}

// 기존 openGuide(type) — 시뮬레이터 호환용 (외부 호출 시) + 직접 type만 받기
function openGuide(type) {
  // 가짜 alert 객체로 변형 선택
  const state = CareSafe.load();
  const senior = state.seniors.find(s => s.id === state.activeUid);
  const fakeAlert = { type, level: type === 'sos' ? 'danger' : 'warn', text: '' };
  const guide = _selectGuide(fakeAlert, senior);
  if (!guide) {
    window.alert('대응가이드가 등록되지 않은 알림 유형입니다.');
    return;
  }
  _renderGuideModal(guide);
}

function _renderGuideModal(guide) {
  document.getElementById('guideTitle').textContent = guide.title || '';
  document.getElementById('guideIntro').textContent =
    (guide.intro || '') + (guide._source ? ` · ${guide._source}` : '');
  const sev = document.getElementById('guideSeverity');
  sev.textContent = LEVEL_TEXT[guide.severity] || '';
  sev.className = 'severity-pill ' + (guide.severity || '');
  const stepsEl = document.getElementById('guideSteps');
  stepsEl.innerHTML = (guide.steps || []).map(s => `
    <li><div>
      <div class="do">${s.do || ''}</div>
      <div class="note">${s.note || ''}</div>
    </div></li>`).join('');
  const pitfallBox = document.getElementById('guidePitfalls');
  const pitfallList = document.getElementById('guidePitfallList');
  if (guide.pitfalls && guide.pitfalls.length) {
    pitfallBox.style.display = 'block';
    pitfallList.innerHTML = guide.pitfalls.map(t => `<li>${t}</li>`).join('');
  } else {
    pitfallBox.style.display = 'none';
  }
  document.getElementById('guideModal').style.display = 'flex';
}

function closeGuide() {
  document.getElementById('guideModal').style.display = 'none';
}

// ===== 생활안전 체크리스트 =====
function isoWeekKey(date = new Date()) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNo = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return `${d.getUTCFullYear()}W${String(weekNo).padStart(2, '0')}`;
}
function loadChecklistState() {
  try { return JSON.parse(localStorage.getItem(CareSafeChecklist.storageKey) || '{}'); }
  catch { return {}; }
}
function saveChecklistState(state) {
  localStorage.setItem(CareSafeChecklist.storageKey, JSON.stringify(state));
}
function getCheckedSet(uid, weekKey) {
  const state = loadChecklistState();
  return new Set(state[`${uid}:${weekKey}`] || []);
}
function toggleCheck(uid, weekKey, itemKey) {
  const state = loadChecklistState();
  const k = `${uid}:${weekKey}`;
  const arr = state[k] || [];
  const idx = arr.indexOf(itemKey);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(itemKey);
  state[k] = arr;
  saveChecklistState(state);
  renderChecklist(uid);
}
function renderChecklist(uid) {
  const weekKey = isoWeekKey();
  const checked = getCheckedSet(uid, weekKey);
  const sections = CareSafeChecklist.sections;
  const total = sections.reduce((sum, s) => sum + s.items.length, 0);
  document.getElementById('checklistCount').textContent = `${checked.size} / ${total}`;
  document.getElementById('checklistBar').style.width = total ? Math.round(checked.size / total * 100) + '%' : '0%';
  const body = document.getElementById('checklistBody');
  body.innerHTML = sections.map(sec => `
    <div class="checklist-section">
      <div class="sec-title">${sec.title}</div>
      ${sec.items.map(it => `
        <div class="checklist-item ${checked.has(it.key) ? 'done' : ''}"
             onclick="toggleCheck('${uid}', '${weekKey}', '${it.key}')">
          <div class="checkbox">${checked.has(it.key) ? '✓' : ''}</div>
          <div class="text">
            ${it.text}
            <div class="tip">${it.tip || ''}</div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function renderEmergencyCard(senior) {
  const preview = document.getElementById('emergencyPreview');
  const tag = document.getElementById('emergencyTag');
  const link = document.getElementById('openCardLink');
  const qrBox = document.getElementById('qrBox');

  const c1 = (senior.emergencyContacts || []).sort((a, b) => (a.priority || 99) - (b.priority || 99))[0];
  const medsCount = (senior.meds || []).length;
  const allergyText = (senior.allergies && senior.allergies.length) ? senior.allergies.join(', ') : '없음';

  preview.innerHTML = `
    <div class="muted" style="display:flex; justify-content:space-between"><span>혈액형</span><strong style="color:#0F172A">${senior.blood || '—'}</strong></div>
    <div class="muted" style="display:flex; justify-content:space-between"><span>알레르기</span><strong style="color:${senior.allergies?.length ? '#DC2626' : '#0F172A'}">${allergyText}</strong></div>
    <div class="muted" style="display:flex; justify-content:space-between"><span>복용약</span><strong style="color:#0F172A">${medsCount}종</strong></div>
    <div class="muted" style="display:flex; justify-content:space-between"><span>1순위 연락처</span><strong style="color:#0F172A">${c1 ? c1.name : '—'}</strong></div>
  `;

  if (senior.qrToken) {
    tag.textContent = '발급됨';
    tag.style.color = 'var(--ok)';
    const url = new URL('emergency.html', location.href);
    url.searchParams.set('token', senior.qrToken);
    link.href = url.href;
    document.getElementById('qrUrl').textContent = url.href;
    document.getElementById('showQrBtn').dataset.url = url.href;
    // QR 박스가 열려 있으면 새 시니어로 다시 생성
    if (qrBox.style.display !== 'none') {
      drawQr(url.href);
    }
  } else {
    tag.textContent = '미발급';
    tag.style.color = 'var(--muted)';
    link.removeAttribute('href');
    qrBox.style.display = 'none';
  }
}

function drawQr(text) {
  const target = document.getElementById('qrcode');
  target.innerHTML = '';
  new QRCode(target, {
    text,
    width: 192, height: 192,
    correctLevel: QRCode.CorrectLevel.H,
  });
}

document.getElementById('showQrBtn').addEventListener('click', () => {
  const url = document.getElementById('showQrBtn').dataset.url;
  if (!url) return alert('QR 토큰이 등록되지 않은 시니어입니다.');
  const box = document.getElementById('qrBox');
  if (box.style.display === 'none') {
    box.style.display = 'block';
    drawQr(url);
  } else {
    box.style.display = 'none';
  }
});

document.getElementById('callDoctor').addEventListener('click', () => {
  const state = CareSafe.load();
  const s = state.seniors.find(x => x.id === state.activeUid);
  if (s?.doctor?.phone) {
    location.href = 'tel:' + s.doctor.phone;
  } else {
    alert('주치의 연락처가 등록되지 않았습니다.');
  }
});

CareSafe.subscribe((msg) => {
  if (msg.type === 'alert' && msg.payload) {
    const state = CareSafe.load();
    if (msg.payload.uid === state.activeUid) {
      CareSafe.toast(msg.payload.text, msg.payload.level);
    }
  }
  render();
});

render();
setInterval(render, 30000); // refresh relative timestamps
</script>
</body>
</html>
